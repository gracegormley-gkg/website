<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video — Grace Gormley</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.cdnfonts.com/css/audrey" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="components.js"></script>
</head>
<body>
  <site-nav></site-nav>
  <main class="page-content">
    <h1>Video</h1>

    <div id="video-list"></div>
  </main>
  <site-footer></site-footer>

  <script>
function isPlaceholder(url) {
  return !url || !url.startsWith('http');
}

function toEmbedUrl(url) {
  var ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&?/]+)/);
  if (ytMatch) return 'https://www.youtube-nocookie.com/embed/' + ytMatch[1];
  var viMatch = url.match(/vimeo\.com\/(\d+)/);
  if (viMatch) return 'https://player.vimeo.com/video/' + viMatch[1];
  var gdMatch = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
  if (gdMatch) return 'https://drive.google.com/file/d/' + gdMatch[1] + '/preview';
  return url;
}

fetch('./data.json')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    var container = document.getElementById('video-list');
    if (!data.videos || data.videos.length === 0) {
      container.innerHTML = '<p>No videos available.</p>';
      return;
    }
    container.innerHTML = data.videos.map(function(v) {
      var isReal = !isPlaceholder(v.embedUrl);
      var embedSrc = isReal ? toEmbedUrl(v.embedUrl) : '';
      return '<article class="video-item">' +
        '<h2 class="video-title">' + v.title + '</h2>' +
        (isReal
          ? '<div class="video-embed"><iframe src="' + embedSrc + '" title="' + v.title + '" allowfullscreen loading="lazy"></iframe></div>'
          : '<div class="video-placeholder" aria-label="Video coming soon"><span>Video available upon request</span></div>'
        ) +
        (v.description ? '<p class="video-desc">' + v.description + '</p>' : '') +
        '</article>';
    }).join('');
  });
  </script>
</body>
</html>
